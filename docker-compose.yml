version: '3.8'

services:
  aikailnov4:
    build: .
    container_name: aikailnov4
    image: aikailnov4:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - aikail-network
    restart: unless-stopped
    command: python3 src/core/aikail.py --help

  redis:
    image: redis:7-alpine
    container_name: aikailnov4-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aikail-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: aikailnov4-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aikail
      - POSTGRES_PASSWORD=aikail_password
      - POSTGRES_DB=aikailnov4
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aikail-network
    restart: unless-stopped

networks:
  aikail-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
